name: Amazon Web App Tests CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Start Selenium Grid (Optional but good for stability)
      run: |
        docker network create selenium
        docker run -d --net selenium --name selenium-hub -p 4444:4444 selenium/hub:4.16.1
        docker run -d --net selenium --name chrome -e SE_EVENT_BUS_HOST=selenium-hub -e SE_EVENT_BUS_PUBLISH_PORT=4442 -e SE_EVENT_BUS_SUBSCRIBE_PORT=4443 -v /dev/shm:/dev/shm selenium/node-chrome:4.16.1

    - name: Run Tests
      run: mvn test -Dcucumber.filter.tags="@WebUI" -DHeadless=true
      continue-on-error: true

    - name: Archive Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/Amazon-reports/
